name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` declares >=18.17.0. Every version named there is tested, so
        # the field is a claim this repo checks rather than one it asserts.
        node: ["18.17", "18", "20", "22", "24"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step, deliberately. The package has no dependencies and no
      # devDependencies, so there is nothing to fetch and nothing to cache. If
      # an install appears here, the zero-dependency claim has stopped being
      # true and `zero-deps.test.js` will say so first.
      - run: npm test

  examples:
    runs-on: ubuntu-latest
    name: the examples actually run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # These ship in the tarball, so a broken one is a broken package. They
      # were broken once already: the constructor started rejecting unknown
      # options, and both examples spread an endpoint record that carries two
      # keys which are not options. Nothing noticed, because nothing ran them.
      #
      # They upload to testnet for real, which costs nothing and is the point:
      # a sample that has never run is not a sample.
      - name: run every example against testnet
        run: |
          npm link
          npm link @ardrive/turbo-upload
          export ARWEAVE_JWK=$(node -e "
            const { generateKeyPairSync } = require('node:crypto');
            process.stdout.write(JSON.stringify(
              generateKeyPairSync('rsa', { modulusLength: 4096 })
                .privateKey.export({ format: 'jwk' })
            ));
          ")
          for f in examples/*.js; do
            echo "--- $f"
            node "$f" || { echo "::error::$f failed"; exit 1; }
          done

  samples:
    runs-on: ubuntu-latest
    name: documented samples run as written
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Two shipped samples used require() with a top-level await, which cannot
      # run: Node retries the file as ESM and require is undefined. Reading them
      # did not reveal it, and running them inside a harness passed while the
      # samples themselves did not.
      - run: node scripts/check-samples.mjs

  conformance:
    runs-on: ubuntu-latest
    name: conformance against arbundles and turbo-sdk
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@v4
      # Node 22, because @ardrive/turbo-sdk@2.1.0 cannot load on Node 18: a
      # transitive dependency of its Solana stack is ESM only. This pins the
      # reference, not the package, which the `test` job runs on every version
      # `engines` names.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # An install, and the only one besides the browser harness: conformance/
      # has its own package.json and lockfile, so the references it checks
      # against never reach the package's tree. The root jobs stay install-free.
      - run: npm ci --no-audit --no-fund
      # verify.js and standalone-check.js: the type 1 corpus, and the reference
      # signer cross-verified both ways against arbundles.
      # type4.js: regenerates the type 4 corpus with turbo-sdk and fails if it
      # differs from the committed one by a byte.
      # cross-verify.js: the package's own exports against arbundles' verifier,
      # both ways, both types, and one-byte tampering refused by both.
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    name: web build in Chromium, Firefox, WebKit, jsdom and Jest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # harness/ has its own package.json and lockfile: Playwright, esbuild,
      # webpack, Vite, Jest and TypeScript are the harness's, never the
      # package's. It installs the package itself through a file: link, so
      # every resolution below goes through the real export map.
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      # The type 4 corpus signed in each browser and in jsdom with a
      # wallet-style signer and no polyfills, byte-identical to turbo-sdk;
      # turbo-sdk's items verified there; a flipped byte refused. Fails if
      # Buffer or process exists in the page.
      - run: npm test
      # jest-environment-jsdom resolves the `browser` condition too.
      - run: npm run jest
      # Which build esbuild, webpack 5 and Vite pick, as the README states it.
      - run: npm run bundlers
      # web.d.ts with no Node types, index.d.ts with them.
      - run: npm run types
      # The live devnet flow (`npm run devnet`) is not run here: it needs a
      # funded key, and a workflow input lands in a public run's event payload.
      # Run it by hand per release; see harness/README.md.

  devnet-script:
    runs-on: ubuntu-latest
    name: the devnet script refuses production
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # scripts/ has its own package.json: @solana/web3.js builds the top-up
      # transfer there, and never reaches the package.
      - run: npm ci --no-audit --no-fund
      # Offline. The live run needs a funded devnet key and stays manual, per
      # release: a key in a workflow input lands in a public run's event payload.
      - run: node live-solana-devnet.js --check-guards
      - name: a mainnet RPC and a production host are refused before any request
        run: |
          set +e
          node live-solana-devnet.js --key /dev/null --rpc https://api.mainnet-beta.solana.com; a=$?
          node live-solana-devnet.js --key /dev/null --upload-url https://upload.ardrive.io; b=$?
          [ "$a" = "2" ] && [ "$b" = "2" ] || { echo "::error::expected both to exit 2, got $a and $b"; exit 1; }

  house-style:
    runs-on: ubuntu-latest
    name: house style
    steps:
      - uses: actions/checkout@v4
      # Em dashes are banned in everything we write. This check exists because
      # the rule was honoured by hand and drifted: a review found 65 of them
      # across this package, in a repo whose CI had no way to notice.
      #
      # The two vectors.json files are excluded. They are generated fixtures,
      # their em dashes sit in description strings, and hand-editing a generated
      # file drifts it from its generator.
      - name: no em dashes
        run: |
          hits=$(git ls-files -z ':!vectors/vectors.json' ':!conformance/vectors.json' \
            | xargs -0 grep -nP '\x{2014}' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Em dashes are banned. Use a comma, a colon, or parentheses."
            exit 1
          fi
          echo "no em dashes"

  no-dependencies:
    runs-on: ubuntu-latest
    name: still zero dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The whole argument for this package is what it does not pull in, so it
      # is checked in CI rather than only in a test file someone could skip.
      - name: assert no dependencies of any kind
        run: |
          deps=$(node -p "JSON.stringify(require('./package.json').dependencies || {})")
          dev=$(node -p "JSON.stringify(require('./package.json').devDependencies || {})")
          echo "dependencies:    $deps"
          echo "devDependencies: $dev"
          if [ "$deps" != "{}" ] || [ "$dev" != "{}" ]; then
            echo "::error::This package must have no dependencies. See README."
            exit 1
          fi
      - name: assert the published tarball adds exactly one lockfile entry
        run: |
          npm pack --silent
          tgz=$(ls -t ./*.tgz | head -1)
          dir=$(mktemp -d)
          cd "$dir" && npm init -y >/dev/null
          npm install --package-lock-only --silent "$OLDPWD/$tgz"
          n=$(node -p "Object.keys(require('$dir/package-lock.json').packages).filter(Boolean).length")
          echo "lockfile entries added: $n"
          [ "$n" = "1" ] || { echo "::error::Expected 1 lockfile entry, got $n"; exit 1; }
