name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` declares >=18.17.0. Every version named there is tested, so
        # the field is a claim this repo checks rather than one it asserts.
        node: ["18.17", "18", "20", "22", "24"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step, deliberately. The package has no dependencies and no
      # devDependencies, so there is nothing to fetch and nothing to cache. If
      # an install appears here, the zero-dependency claim has stopped being
      # true and `zero-deps.test.js` will say so first.
      - run: npm test

  examples:
    runs-on: ubuntu-latest
    name: the examples actually run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # These ship in the tarball, so a broken one is a broken package. They
      # were broken once already: the constructor started rejecting unknown
      # options, and both examples spread an endpoint record that carries two
      # keys which are not options. Nothing noticed, because nothing ran them.
      #
      # They upload to testnet for real, which costs nothing and is the point:
      # a sample that has never run is not a sample.
      - name: run every example against testnet
        run: |
          npm link
          npm link @ardrive/turbo-upload
          export ARWEAVE_JWK=$(node -e "
            const { generateKeyPairSync } = require('node:crypto');
            process.stdout.write(JSON.stringify(
              generateKeyPairSync('rsa', { modulusLength: 4096 })
                .privateKey.export({ format: 'jwk' })
            ));
          ")
          for f in examples/*.js; do
            echo "--- $f"
            node "$f" || { echo "::error::$f failed"; exit 1; }
          done

  house-style:
    runs-on: ubuntu-latest
    name: house style
    steps:
      - uses: actions/checkout@v4
      # Em dashes are banned in everything we write. This check exists because
      # the rule was honoured by hand and drifted: a review found 65 of them
      # across this package, in a repo whose CI had no way to notice.
      #
      # The two vectors.json files are excluded. They are generated fixtures,
      # their em dashes sit in description strings, and hand-editing a generated
      # file drifts it from its generator.
      - name: no em dashes
        run: |
          hits=$(git ls-files -z ':!vectors/vectors.json' ':!conformance/vectors.json' \
            | xargs -0 grep -nP '\x{2014}' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Em dashes are banned. Use a comma, a colon, or parentheses."
            exit 1
          fi
          echo "no em dashes"

  no-dependencies:
    runs-on: ubuntu-latest
    name: still zero dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The whole argument for this package is what it does not pull in, so it
      # is checked in CI rather than only in a test file someone could skip.
      - name: assert no dependencies of any kind
        run: |
          deps=$(node -p "JSON.stringify(require('./package.json').dependencies || {})")
          dev=$(node -p "JSON.stringify(require('./package.json').devDependencies || {})")
          echo "dependencies:    $deps"
          echo "devDependencies: $dev"
          if [ "$deps" != "{}" ] || [ "$dev" != "{}" ]; then
            echo "::error::This package must have no dependencies. See README."
            exit 1
          fi
      - name: assert the published tarball adds exactly one lockfile entry
        run: |
          npm pack --silent
          tgz=$(ls -t ./*.tgz | head -1)
          dir=$(mktemp -d)
          cd "$dir" && npm init -y >/dev/null
          npm install --package-lock-only --silent "$OLDPWD/$tgz"
          n=$(node -p "Object.keys(require('$dir/package-lock.json').packages).filter(Boolean).length")
          echo "lockfile entries added: $n"
          [ "$n" = "1" ] || { echo "::error::Expected 1 lockfile entry, got $n"; exit 1; }
